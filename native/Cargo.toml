[package]
name = "kit-checklist-tab"
version = "0.2.0"
edition = "2024"
description = "The Checklist tab of the Hangar kit-checklist, native: Rust compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]   # the module Hangar runs, and the library its tests use

[dependencies]
# Until a release tag holds the SDK, its branch.
hangar-kit-sdk = { git = "https://github.com/hangar-ai/hangar", branch = "feat/native-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
