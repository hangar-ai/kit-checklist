name: CI

on:
  push:
    branches: [main, rust-rewrite]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  kit-check:
    uses: hangar-ai/.github/.github/workflows/kit-check.yml@rust-rewrite

  # The tab is native: its tests, and the module Hangar runs. Hangar never builds
  # a kit, so tabs/checklist.wasm is committed, and this job fails when it is
  # not what native/ builds (scripts/build-native.sh, with the compiler that
  # native/rust-toolchain.toml pins, gives the same bytes anywhere).
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, as native/rust-toolchain.toml pins it
        working-directory: native
        run: rustup toolchain install --profile minimal
      - name: Tests of the native tab
        working-directory: native
        run: cargo test --locked
      - name: The committed module is this build
        run: scripts/build-native.sh --check
